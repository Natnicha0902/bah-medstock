<style>
:root{
  --bg:#E8EDF1; --panel:#FFFFFF; --ink:#15232E; --muted:#5B6B78; --line:#CBD5DD; --line-soft:#E3E9EE;
  --brand:#0A5A6B; --brand-dk:#07444F; --brand-soft:#DCEEF1;
  --warn:#8A5200; --warn-soft:#FFF1D6;
  --danger:#B42318; --danger-soft:#FDE7E5;
  --ok:#18794E; --ok-soft:#DDF3E8;
  --font:"Sarabun","Noto Sans Thai","Leelawadee UI","Segoe UI","Tahoma",system-ui,sans-serif;
  --mono:"SF Mono","Consolas","Menlo","Courier New",monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #2B8CA0;outline-offset:2px}
.top{background:var(--brand-dk);color:#fff;display:flex;align-items:center;gap:16px;padding:env(safe-area-inset-top,0px) 20px 0;min-height:56px;flex-wrap:wrap}
.brand{font-weight:800;font-size:19px;letter-spacing:.3px;white-space:nowrap}
.brand span{font-weight:400;opacity:.8}
.nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.nav a{color:#CFE6EA;text-decoration:none;padding:16px 14px;border-bottom:4px solid transparent;font-weight:500}
.nav a:hover{color:#fff}
.nav a.on{color:#fff;border-bottom-color:#7FD1E0}
.topright{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0}
.top .btn.ghost{color:#fff;border-color:#4C8994}
.top .btn.ghost:hover{background:#0B5665}
body.locked .nav,body.locked #btnShare,body.locked #btnSettings,body.locked #btnLock{display:none}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:600;border-radius:999px;padding:3px 12px;background:#0B5665;color:#DFF3F6;white-space:nowrap}
.pill i{width:9px;height:9px;border-radius:50%;background:#9AB;display:inline-block}
.pill.cloud i{background:#4ADE80}
.pill.local{background:var(--warn-soft);color:var(--warn)}
.pill.local i{background:#D98A00}
.pill.error{background:var(--danger-soft);color:var(--danger)}
.pill.error i{background:var(--danger)}
.banner{background:var(--warn-soft);color:var(--warn);padding:9px 20px;font-weight:600;border-bottom:1px solid #EBCB8B}
.banner a{color:inherit}
.banner.red{background:var(--danger);color:#fff;border:0}
main{padding:20px;max-width:1500px;margin:0 auto}
h1{font-size:22px;margin:0 0 14px}
h2{font-size:18px;margin:0 0 10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:9px 16px;cursor:pointer;font-weight:500;min-height:42px}
.btn:hover{background:#F3F6F8}
.btn[disabled]{opacity:.55;cursor:wait}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}

.btn.ghost{background:transparent}
.btn.small{padding:4px 12px;min-height:32px;font-size:14px}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger:hover{background:#8F1B12}
.btn.big{font-size:18px;min-height:52px;width:100%;font-weight:700}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=number],input[type=search],input[type=password],input[type=date],input:not([type]),textarea,select{width:100%;border:1.5px solid #9FB0BC;border-radius:6px;padding:10px 12px;background:#fff;min-height:44px}
input:focus,textarea:focus,select:focus{border-color:var(--brand)}
.err input,input.err{border-color:var(--danger);background:var(--danger-soft)}
label{display:block;font-weight:600;margin-bottom:5px}
.field{margin-bottom:16px}
.hint{font-size:14px;margin-top:5px;color:var(--muted);min-height:20px}
.hint.ok{color:var(--ok);font-weight:600}
.hint.warn{color:var(--warn);font-weight:600}
.qtyrow{display:flex;gap:8px}
.qtyrow select{width:auto;min-width:96px}
.main-grid{display:grid;grid-template-columns:minmax(360px,5fr) 7fr;gap:20px;align-items:start}
.queue-row{display:flex;gap:12px;align-items:stretch}
.seg{display:flex;border:1.5px solid #9FB0BC;border-radius:8px;overflow:hidden;flex:none}
.seg button{border:0;background:#fff;width:62px;font-size:24px;font-weight:700;cursor:pointer;min-height:52px}
.seg button+button{border-left:1.5px solid #9FB0BC}
.seg button.on{background:var(--brand);color:#fff}
.queue-row input{font-size:24px;font-weight:700;min-height:52px;font-family:var(--mono)}
.picker{position:relative}
.sugg{position:absolute;z-index:20;left:0;right:0;top:100%;background:#fff;border:1.5px solid var(--brand);border-radius:6px;margin-top:2px;max-height:320px;overflow:auto}
.sugg .it{padding:9px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line-soft)}
.sugg .it:last-child{border:0}
.sugg .it.act,.sugg .it:hover{background:var(--brand-soft)}
.sugg small{color:var(--muted);white-space:nowrap}
.picked{display:flex;align-items:center;gap:12px;border:1.5px solid var(--brand);background:var(--brand-soft);border-radius:6px;padding:8px 12px}
.picked .pn{flex:1}
.picked .pn b{display:block}
.picked .pn span{font-size:14px;color:var(--muted)}
.hp-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.hp-head h2{margin:0}
.scroll{max-height:calc(100vh - 210px);overflow:auto;border:1px solid var(--line-soft);border-radius:6px}
.tbl{width:100%;border-collapse:collapse}

.tbl tr.click:hover td{background:#F3F8FA}
.tbl tr.voided td{color:#8A97A1}
.tbl tr.voided td b,.tbl tr.voided .num{text-decoration:line-through}
.dt{white-space:nowrap;font-variant-numeric:tabular-nums}
.dt small{display:block;color:var(--muted)}
.tag{display:inline-block;font-size:13px;font-weight:600;border-radius:4px;padding:1px 8px;margin-right:4px}
.t-dispense{background:var(--brand-soft);color:var(--brand-dk)}
.t-add,.t-initial{background:var(--ok-soft);color:var(--ok)}
.t-deduct{background:var(--danger-soft);color:var(--danger)}
.t-adjust{background:var(--warn-soft);color:var(--warn)}
.t-void{background:#EEE;color:#444}
.low{display:inline-block;background:var(--danger);color:#fff;font-size:12px;font-weight:700;border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:middle}
.pos{color:var(--ok);font-weight:700}
.neg{color:var(--danger);font-weight:700}
.sub{color:var(--muted);font-size:14px}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.pagehead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.pagehead h1{margin:0}
.split{display:grid;grid-template-columns:minmax(300px,4fr) 8fr;gap:20px;align-items:start}
.dlist{list-style:none;margin:10px 0 0;padding:0;max-height:calc(100vh - 330px);overflow:auto;border:1px solid var(--line-soft);border-radius:6px}
.ditem{display:grid;grid-template-columns:1fr auto;gap:0 10px;padding:10px 12px;border-bottom:1px solid var(--line-soft);text-decoration:none;color:inherit}
.ditem:hover{background:#F3F8FA}
.ditem.sel{background:var(--brand-soft);box-shadow:inset 4px 0 0 var(--brand)}
.ditem .stk{grid-row:1/3;grid-column:2;align-self:center;font-weight:700;font-variant-numeric:tabular-nums}
.ditem .stk.zero{color:var(--danger)}
.frow{display:grid;grid-template-columns:170px 1fr auto;gap:10px 14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.frow .lb{color:var(--muted);font-weight:600}
.frow .val{font-size:18px;word-break:break-word}
.frow .val.mono{font-family:var(--mono);letter-spacing:1px}
.frow .val .none{color:var(--warn);font-size:16px}
.bigstock{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.bc-box{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.bc-box svg{background:#fff;border:1px solid var(--line-soft);border-radius:4px;max-width:100%;height:auto}
.bc-actions{display:flex;gap:8px;flex-wrap:wrap}
.opbox{margin-top:20px;border:1px solid var(--line);border-radius:8px;padding:16px;background:#F7FAFB}
.opgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.opgrid .wide{grid-column:1/3}
.preview{font-weight:600;margin:0 0 12px}
.dangerzone{margin-top:28px}
.dangerzone .btn{width:100%;background:#fff;border:2.5px solid var(--danger);color:var(--danger);font-weight:700;min-height:50px}
.dangerzone .btn:hover{background:var(--danger-soft)}
.backlink{display:inline-block;margin-bottom:10px;color:var(--brand);font-weight:600;text-decoration:none}
.backlink:hover{text-decoration:underline}
.summary{display:flex;gap:28px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.overlay{position:fixed;inset:0;background:rgba(15,30,40,.55);display:flex;align-items:flex-start;justify-content:center;padding:6vh 14px;overflow:auto;z-index:100}
.modal{background:#fff;border-radius:10px;width:100%;max-width:520px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal h2{font-size:20px;margin-bottom:14px}
.mfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.msg{margin:0;padding:12px 14px;border-radius:6px;font-size:17px}
.msg.warn{background:var(--warn-soft);color:var(--warn)}
.msg.danger{background:var(--danger-soft);color:var(--danger);font-weight:600}
.msg.info{background:var(--brand-soft);color:var(--brand-dk)}
.msg ul{margin:6px 0 0;padding-left:22px}
.msg .th{display:block;font-size:24px;font-weight:700;margin-bottom:2px}
.form-err{color:var(--danger);font-weight:600;margin-top:4px;min-height:22px}
.kv{width:100%;border-collapse:collapse;margin-bottom:14px}
.kv td{padding:6px 0;border-bottom:1px solid var(--line-soft);vertical-align:top}
.kv td:first-child{color:var(--muted);width:42%}
.kv td:last-child{font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.tiles.one{grid-template-columns:1fr}
.tile{border:2px solid var(--brand);border-radius:10px;text-align:center;padding:12px 6px;background:var(--brand-soft)}
.tile b{display:block;font-size:46px;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--brand-dk)}
.tile span{font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--brand)}
.tile.zero{background:#F3F6F8;border-color:var(--line)}
.tile.zero b,.tile.zero span{color:#8A97A1}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:8px;z-index:200;font-weight:500;max-width:90vw}
.toast.ok{background:var(--ok)}
.toast.err{background:var(--danger)}
.switch{display:flex;gap:10px;align-items:center;margin:8px 0 16px}
.switch input{width:20px;height:20px}
.switch label{margin:0;font-weight:500}
.setrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.qrbox{display:flex;justify-content:center;padding:14px;background:#fff;border:1px solid var(--line);border-radius:8px;margin-bottom:14px;min-height:120px;align-items:center}
.qrbox img,.qrbox canvas{max-width:100%;height:auto}
.sec-title{font-weight:700;margin:14px 0 6px}
.gate{max-width:400px;margin:9vh auto 0;text-align:center}
.gate h1{font-size:30px;margin-bottom:4px}
.gate .sub{margin-bottom:18px}
.gate input{text-align:center;font-size:24px;letter-spacing:6px;min-height:54px}
.gate .form-err{text-align:center}
.chk{display:flex;gap:8px;align-items:center;margin:8px 0 0;font-weight:500}
.chk input{width:18px;height:18px}
.act-btns{display:flex;gap:4px;justify-content:flex-end}
.date-filter{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px;background:#F1F5F8;padding:12px 16px;border-radius:8px;border:1px solid var(--line)}
.date-filter .fgroup{display:flex;align-items:center;gap:6px}
.date-filter label{margin:0;white-space:nowrap;font-size:14px}
.date-filter input[type=date]{min-height:38px;padding:4px 8px;width:auto}

@media print {
  header.top, #banner, .backlink, .btnrow, .act-btns, .date-filter, .toast, .overlay { display: none !important; }
  body { background: #fff !important; color: #000 !important; }
  main { padding: 0 !important; max-width: 100% !important; }
  .panel { border: none !important; padding: 0 !important; }
  .scroll { max-height: none !important; border: none !important; overflow: visible !important; }
  .tbl th { background: #eee !important; color: #000 !important; border-bottom: 2px solid #000 !important; }
  .tbl td { border-bottom: 1px solid #ccc !important; }
}

@media (max-width:980px){
  .main-grid,.split{grid-template-columns:1fr}
  .scroll{max-height:none}
  .dlist{max-height:320px}
  .frow{grid-template-columns:1fr auto}
  .frow .lb{grid-column:1/3}
  .opgrid{grid-template-columns:1fr}
  .opgrid .wide{grid-column:auto}
  main{padding:12px}
  .top{padding-left:12px;padding-right:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

  const bits = bytes.length * 8;
  bytes.push(0x80); while (bytes.length % 64 !== 56) bytes.push(0);
  [Math.floor(bits / 4294967296), bits >>> 0].forEach(v => bytes.push((v >>> 24) & 255, (v >>> 16) & 255, (v >>> 8) & 255, v & 255));
  const H = SHA.H.slice(), K = SHA.K, w = new Array(64);
  const rr = (x, n) => (x >>> n) | (x << (32 - n));
  for (let i = 0; i < bytes.length; i += 64){
    for (let t = 0; t < 16; t++) w[t] = (bytes[i+4*t] << 24) | (bytes[i+4*t+1] << 16) | (bytes[i+4*t+2] << 8) | bytes[i+4*t+3];
    for (let t = 16; t < 64; t++){
      const s0 = rr(w[t-15], 7) ^ rr(w[t-15], 18) ^ (w[t-15] >>> 3), s1 = rr(w[t-2], 17) ^ rr(w[t-2], 19) ^ (w[t-2] >>> 10);
      w[t] = (w[t-16] + s0 + w[t-7] + s1) | 0;
    }
    let [a, b, c, d, e, f, g, h] = H;
    for (let t = 0; t < 64; t++){
      const S1 = rr(e, 6) ^ rr(e, 11) ^ rr(e, 25), ch = (e & f) ^ (~e & g), t1 = (h + S1 + ch + K[t] + w[t]) | 0;
      const S0 = rr(a, 2) ^ rr(a, 13) ^ rr(a, 22), mj = (a & b) ^ (a & c) ^ (b & c), t2 = (S0 + mj) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    [a, b, c, d, e, f, g, h].forEach((v, j) => { H[j] = (H[j] + v) | 0; });
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}

function recompute(){
  DB.log.sort((a, b) => a.ts - b.ts || (a.id < b.id ? -1 : 1));
  const sums = {};
  VOIDED = new Set();
  DB.log.forEach(e => { sums[e.drugId] = r2((sums[e.drugId] || 0) + e.delta); e.balance = sums[e.drugId]; if (e.voidOf) VOIDED.add(e.voidOf); });
  DB.drugs.forEach(d => { d.stock = sums[d.id] || 0; });
}
function nextBarcodeFrom(drugs){
  const used = new Set(drugs.map(d => d.barcode));
  let max = 0, len = 8;
  drugs.forEach(d => { if (/^\d+$/.test(d.barcode)){ const n = Number(d.barcode); if (n > max){ max = n; len = d.barcode.length; } } });
  let n = max ? max + 1 : 88526001;
  while (used.has(String(n).padStart(len, '0'))) n++;
  return String(n).padStart(len, '0');
}
const nextBarcode = () => nextBarcodeFrom(DB.drugs);
function searchDrugs(q, limit){
  q = norm(q);
  if (!q) return [];
  const out = [];
  DB.drugs.forEach(d => {
    const n = norm(d.name), h = norm(d.house), b = norm(d.barcode);
    let sc = 0;
    if (b === q) sc = 100; else if (n.startsWith(q)) sc = 60; else if (n.includes(q)) sc = 40; else if (h.includes(q)) sc = 30; else if (b.includes(q)) sc = 20;
    if (sc) out.push({d, sc});
  });
  out.sort((a, b) => b.sc - a.sc || a.d.name.localeCompare(b.d.name));
  return out.slice(0, limit || 8).map(x => x.d);
}
const isLow = d => Number(d.minStock) > 0 && d.stock <= Number(d.minStock);

function packInfo(d){ const spb = Number(d.stripsPerBox) || 0, tps = Number(d.tabsPerStrip) || 0; return {spb, tps, perBox: spb && tps ? spb * tps : 0, unit: d.unit || 'เม็ด'}; }
function breakdown(qty, d){
  const p = packInfo(d);
  let rest = r2(qty), box = 0, stripN = 0;
  if (p.perBox){ box = Math.floor(rest / p.perBox + 1e-9); rest = r2(rest - box * p.perBox); }
  if (p.tps){ stripN = Math.floor(rest / p.tps + 1e-9); rest = r2(rest - stripN * p.tps); }
  return {box, strip: stripN, tab: rest, hasBox: !!p.perBox, hasStrip: !!p.tps, unit: p.unit};
}
function breakdownText(qty, d){
  const b = breakdown(qty, d), out = [];
  if (b.hasBox) out.push(fmt(b.box) + ' กล่อง');
  if (b.hasStrip) out.push(fmt(b.strip) + ' แผง');
  out.push(fmt(b.tab) + ' ' + b.unit);
  return out.join(' ');
}

let chain = Promise.resolve();

function rebuildLog(){

function startCloud(db){

    DB.drugs = s.docs.map(d => Object.assign({stock: 0}, strip(d.data()), {id: d.id}))
      .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0) || (a.seq || 0) - (b.seq || 0) || a.name.localeCompare(b.name));
    flags.drugs = true; cloudChanged();
  }, onErr);
  db.collection('staff').onSnapshot(s => {
    DB.staff = s.docs.map(d => Object.assign({}, d.data(), {id: d.id})).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    flags.staff = true; cloudChanged();
  }, onErr);
  db.collection('log').onSnapshot(s => {
    logDocs.clear();
    s.docs.forEach(d => {
      const entries = (d.data() || {}).entries || [];
      logDocs.set(d.id, entries);
      if (d.id.endsWith('_' + DEVICE) && (!ownLog[d.id] || ownLog[d.id].length < entries.length)) ownLog[d.id] = entries.slice();
    });
    rebuildLog(); flags.log = true; cloudChanged();
  }, onErr);
  db.collection('config').onSnapshot(s => {
    const st = s.docs.find(d => d.id === 'settings'), au = s.docs.find(d => d.id === 'auth');
    DB.settings = Object.assign(DEF_SETTINGS(), st ? st.data() : {});
    DB.auth = au && au.data() && au.data().hash ? {salt: au.data().salt, hash: au.data().hash, changedAt: au.data().changedAt} : null;
    metaSeeded = s.docs.some(d => d.id === 'meta');
    flags.config = true; cloudChanged();
  }, onErr);
}

async function addLogs(entries){
  if (MODE === 'cloud'){
    const byDay = {};
    entries.forEach(e => { (byDay[dayKey(e.ts)] = byDay[dayKey(e.ts)] || []).push(e); });
    await enqueue(async () => {
      for (const day of Object.keys(byDay)){
        const id = day + '_' + DEVICE;
        const next = (ownLog[id] || (logDocs.get(id) || []).slice()).concat(byDay[day]);
        await dbc.doc('log/' + id).set({device: DEVICE, day, entries: next});
        ownLog[id] = next; logDocs.set(id, next);
      }
    });
    rebuildLog(); finish();
  } else {
    entries.forEach(e => DB.log.push(Object.assign({}, e))); finish();
  }
}
async function updateLogEntry(entryId, patch){
  if (MODE === 'cloud'){
    let targetDocId = null, targetIndex = -1;
    logDocs.forEach((entries, docId) => {
      const idx = entries.findIndex(e => e.id === entryId);
      if (idx !== -1){ targetDocId = docId; targetIndex = idx; }
    });
    if (targetDocId && targetIndex !== -1){
      const entries = logDocs.get(targetDocId).slice();
      entries[targetIndex] = Object.assign({}, entries[targetIndex], patch);
      await dbc.doc('log/' + targetDocId).update({entries});
      logDocs.set(targetDocId, entries);
      rebuildLog(); finish();
    }
  } else {
    const e = DB.log.find(x => x.id === entryId);
    if (e){ Object.assign(e, patch); finish(); }
  }
}

function wrapFirestore(fs){
  function wrapDoc(ref){
    return {
      async get(){ const d = await ref.get(); return {id: ref.id, exists: !!d.exists, data: () => d.data()}; },
      set: obj => ref.set(obj),
      update: obj => ref.update(obj),
      delete: () => ref.delete(),
      async acquire(){ return {acquired: true}; }
    };
  }
  function wrapCol(ref){
    return {
      onSnapshot(cb, onErr){ return ref.onSnapshot(s => cb({docs: s.docs.map(d => ({id: d.id, data: () => d.data()}))}), onErr); },
      async get(){ const s = await ref.get(); return {docs: s.docs.map(d => ({id: d.id, data: () => d.data()}))}; },
      doc(id){ return wrapDoc(ref.doc(id)); }
    };
  }
  return {collection: name => wrapCol(fs.collection(name)), doc: path => wrapDoc(fs.doc(path))};
}
async function tryConnectFirebase(){
  const cfg = getFirebaseConfig();
  if (!cfg || typeof firebase === 'undefined') return null;
  try{
    if (!firebase.apps.length) firebase.initializeApp(cfg);
    const fs = firebase.firestore();
    fs.settings({ experimentalForceLongPolling: true });
    try{ if (firebase.auth) await firebase.auth().signInAnonymously(); }catch(_){}
    return wrapFirestore(fs);
  }catch(e){ console.error('Firebase connect failed', e); return e; }
}

const C128 = ["212222","222122","222221","121223","121322","131222","122213","122312","132212","221213","221312","231212","112232","122132","122231","113222","123122","123221","223211","221132","221231","213212","223112","312131","311222","321122","321221","312212","322112","322211","212123","212321","232121","111323","131123","131321","112313","132113","132311","211313","231113","231311","112133","112331","132131","113123","113321","133121","313121","211331","231131","213113","213311","213131","311123","311321","331121","312113","312311","332111","314111","221411","431111","111224","111422","121124","121421","141122","141221","112214","112412","122114","122411","142112","142211","241211","221114","413111","241112","134111","111242","121142","121241","114212","124112","124211","411212","421112","421211","212141","214121","412121","111143","111341","131141","114113","114311","411113","411311","113141","114131","311141","411131","211412","211214","211232","2331112"];
function code128Values(text){
  text = String(text);
  const vals = [];
  if (/^\d+$/.test(text) && text.length % 2 === 0){
    vals.push(105);
    for (let i = 0; i < text.length; i += 2) vals.push(parseInt(text.substr(i, 2), 10));
  } else {
    vals.push(104);
    for (const ch of text){ let c = ch.charCodeAt(0); if (c < 32 || c > 126) c = 63; vals.push(c - 32); }
  }
  let sum = vals[0];
  for (let i = 1; i < vals.length; i++) sum += vals[i] * i;
  vals.push(sum % 103);
  vals.push(106);
  return vals;
}
function barcodeSVG(text, opt){
  opt = opt || {};
  const mod = opt.module || 2, h = opt.height || 70, quiet = 10, textH = 22;
  const vals = code128Values(text);
  let x = quiet * mod, bars = '';
  vals.forEach(v => {
    const p = C128[v];
    for (let i = 0; i < p.length; i++){
      const w = parseInt(p[i], 10) * mod;
      if (i % 2 === 0) bars += '<rect x="' + x + '" y="0" width="' + w + '" height="' + h + '"/>';
      x += w;
    }
  });
  const W = x + quiet * mod, H = h + textH;
  return '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="บาร์โค้ด ' + esc(text) + '">' +
    '<rect width="' + W + '" height="' + H + '" fill="#fff"/><g fill="#000">' + bars + '</g>' +
    '<text x="' + (W / 2) + '" y="' + (h + 17) + '" text-anchor="middle" font-family="Consolas,Courier New,monospace" font-size="16" fill="#000">' + esc(text) + '</text></svg>';
}
function svgToPNG(svg, cb){
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = img.width * 2; c.height = img.height * 2;
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
    g.drawImage(img, 0, 0, c.width, c.height);
    c.toBlob(b => cb(b), 'image/png');
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

  wrap._dismiss = o.dismissible !== false ? api : null;

function toCSV(headers, rows){
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';

function buildXLSX(sheets){
  const wb = XLSX.utils.book_new();
  sheets.forEach(s => {
    const ws = XLSX.utils.aoa_to_sheet([s.headers].concat(s.rows));
    ws['!cols'] = s.headers.map((h, i) => ({wch: Math.min(40, Math.max(String(h).length + 2, ...s.rows.slice(0, 200).map(r => String(r[i] == null ? '' : r[i]).length + 2)))}));
    XLSX.utils.book_append_sheet(wb, ws, s.name.replace(/[\\/?*\[\]:]/g, ' ').slice(0, 31));
  });
  return new Blob([XLSX.write(wb, {bookType: 'xlsx', type: 'array'})], {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

  const blob = data instanceof Blob ? data : new Blob([data]);
  const a = document.createElement('a');

}
function submitMain(){
  if (busy) return;
  clearFlags();
  const missing = [], order = [];
  const qnum = form.qnum.trim(), rx = form.rx.trim();
  const qty = parseQty(form.qty);
  const d = drugById(form.drugId);
  const patient = form.patient.trim();
  if (!qnum){ missing.push('เลขคิว'); order.push('f_queue'); }
  if (!d){ missing.push('ยา'); order.push('f_drug'); }
  if (d && is28(d.house) && !patient){ missing.push('ชื่อ-นามสกุล ผู้ใช้ยา (ยาตู้ 28)'); order.push('f_patient'); }
  if (!(qty > 0)){ missing.push('จำนวนยา (ตัวเลขมากกว่า 0 ทศนิยมไม่เกิน 2 ตำแหน่ง)'); order.push('f_qty'); }
  if (missing.length){
    order.forEach(id => $('#' + id).classList.add('err'));
    alertBox('กรอกข้อมูลไม่ครบ', '', {html: 'กรุณาตรวจสอบช่องต่อไปนี้<ul>' + missing.map(m => '<li>' + esc(m) + '</li>').join('') + '</ul>', onOk: () => flag(order[0])});
    return;
  }
  const staff = staffByBhis(form.bhis);
  if (!staff){
    $('#f_bhis').classList.add('err');
    alertBox('ต้องระบุผู้ดำเนินการ', '', {html: '<span class="th">ลงชื่อผู้ดำเนินการ</span>' + (form.bhis.trim()
      ? 'เลข BHIS <b>' + esc(form.bhis.trim()) + '</b> ไม่มีในข้อมูลเจ้าหน้าที่'
      : 'กรุณากรอกเลข BHIS ของผู้ดำเนินการ'),
      onOk: () => $('#bhis').focus()});
    return;
  }
  if (qty > d.stock && !DB.settings.allowNegative){
    $('#f_qty').classList.add('err');
    alertBox('สต็อกไม่พอ', d.name + ' คงเหลือ ' + fmt(d.stock) + ' ' + (d.unit || 'เม็ด') + ' แต่ต้องการจ่าย ' + fmt(qty), {tone: 'danger', onOk: () => $('#qty').focus()});
    return;
  }
  confirmDispense(d, qty, staff, qnum, rx, patient);
}
function confirmDispense(d, qty, staff, qnum, rx, patient){
  const queue = form.letter + qnum;
  openModal({title: 'ยืนยันการจ่ายยา', dismissible: true,
    html: '<table class="kv"><tr><td>คิว</td><td>' + esc(queue) + '</td></tr>' +
      '<tr><td>เลขที่ใบสั่งยา</td><td>' + (rx ? esc(rx) : '-') + '</td></tr>' +
      '<tr><td>ยา</td><td>' + esc(d.name) + '</td></tr>' +
      '<tr><td>บ้านเลขที่</td><td>' + esc(d.house) + '</td></tr>' +
      (patient ? '<tr><td>ผู้ใช้ยา</td><td>' + esc(patient) + '</td></tr>' : '') +
      '<tr><td>ผู้ดำเนินการ</td><td>' + esc(staff.name) + ' (BHIS ' + esc(staff.bhis) + ')</td></tr></table>' +
      '<div class="field"><label for="qty2">พิมพ์จำนวนที่จ่ายอีกครั้งเพื่อยืนยัน (' + esc(d.unit || 'เม็ด') + ')</label><input id="qty2" type="text" inputmode="decimal" autocomplete="off"></div>',
    actions: [
      {label: 'ยกเลิก', onClick: m => m.close()},
      {label: 'ยืนยันและบันทึก', cls: 'primary', primary: true, onClick: m => {
        const again = parseQty($('#qty2', m.el).value);
        if (again !== qty){
          m.close();
          $('#f_qty').classList.add('err');
          alertBox('ตรวจสอบจำนวนอีกครั้ง', '', {tone: 'danger', okText: 'กลับไปแก้ไข', html: '<span class="th">จำนวนไม่ตรงกัน</span>', onOk: () => { const q = $('#qty'); if (q){ q.focus(); q.select(); } }});
          return;
        }
        m.close();
        commitDispense(d.id, qty, staff.bhis, queue, rx, patient);

}
async function commitDispense(drugId, qty, bhis, queue, rx, patient){
  const d = drugById(drugId), staff = staffByBhis(bhis);
  if (!d){ alertBox('ไม่พบข้อมูลยา', 'ยานี้ถูกลบไปแล้ว', {tone: 'danger'}); return; }
  if (!staff){ alertBox('ต้องระบุผู้ดำเนินการ', '', {tone: 'danger', html: '<span class="th">ลงชื่อผู้ดำเนินการ</span>ไม่พบเลข BHIS'}); return; }
  if (qty > d.stock && !DB.settings.allowNegative){ alertBox('สต็อกไม่พอ', 'คงเหลือเพียง ' + fmt(d.stock), {tone: 'danger'}); return; }
  busy = true; const sb = $('#btnSave'); if (sb) sb.disabled = true;
  try{
    await addLogs([{id: uid(), ts: Date.now(), type: 'dispense', drugId: d.id, drugName: d.name, house: d.house, delta: -qty, queue, rx: rx || '', patient: patient || '', bhis: staff.bhis, staffName: staff.name, note: ''}]);
  }catch(e){
    busy = false; if (sb) sb.disabled = false;
    alertBox('บันทึกไม่สำเร็จ', errText(e), {tone: 'danger'});
    return;
  }
  busy = false;
  form.qnum = ''; form.rx = ''; form.drugId = null; form.qty = ''; form.patient = '';
  if (currentRoute.name === 'main') renderMain();
  showPrepare(drugId, qty, queue, rx);
}
function tilesHTML(qty, d){
  if (!hasPack(d)) return '<div class="tiles one"><div class="tile"><b>' + fmt(qty) + '</b><span>' + esc(d.unit || 'เม็ด') + '</span></div></div>';
  const b = breakdown(qty, d);
  const t = (n, l) => '<div class="tile' + (n === 0 ? ' zero' : '') + '"><b>' + fmt(n) + '</b><span>' + l + '</span></div>';
  return '<div class="tiles" style="grid-template-columns:repeat(' + (b.hasBox ? 3 : 2) + ',1fr)">' + (b.hasBox ? t(b.box, 'กล่อง') : '') + t(b.strip, 'แผง') + t(b.tab, esc(b.unit)) + '</div>';
}
function showPrepare(drugId, qty, queue, rx){

/* ================= History ================= */
function lastEntryOf(id){ for (let i = DB.log.length - 1; i >= 0; i--) if (DB.log[i].drugId === id) return DB.log[i]; return null; }
function histItems(){
  const q = norm($('#hq') ? $('#hq').value : '');
  const items = DB.drugs.filter(d => !q || norm(d.name).includes(q) || norm(d.house).includes(q) || norm(d.barcode).includes(q))
    .map(d => ({d, last: lastEntryOf(d.id), n: DB.log.filter(e => e.drugId === d.id).length}));
  items.sort((a, b) => (b.last ? b.last.ts : 0) - (a.last ? a.last.ts : 0) || a.d.name.localeCompare(b.d.name));
  return items;
}
function drawHistIdx(){
  const items = histItems();
  $('#hidx').innerHTML = items.length
    ? '<table class="tbl"><thead><tr><th>บ้านเลขที่</th><th>ชื่อยา</th><th>รายการล่าสุด</th><th class="num">จำนวนรายการ</th><th class="num">คงเหลือ</th></tr></thead><tbody>' +
      items.map(x => '<tr class="click" tabindex="0" data-go="#/history/' + x.d.id + '"><td>' + esc(x.d.house) + '</td><td><b>' + esc(x.d.name) + '</b></td><td class="dt">' +
        (x.last ? fmtDate(x.last.ts) + ' ' + fmtTime(x.last.ts) : '<span class="sub">ยังไม่มี</span>') + '</td><td class="num">' + x.n + '</td><td class="num"><b>' + fmt(x.d.stock) + '</b></td></tr>').join('') + '</tbody></table>'
    : '<div class="empty">ไม่พบยาที่ค้นหา</div>';
}

function filterLogsByDate(list, startStr, endStr){
  return list.filter(e => {
    const d = new Date(e.ts);
    const day = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    if (startStr && day < startStr) return false;
    if (endStr && day > endStr) return false;
    return true;
  });
}

        list.map(e => '<tr class="' + (VOIDED.has(e.id) ? 'voided' : '') + '"><td class="dt">' + fmtDate(e.ts) + '</td><td class="dt">' + fmtTime(e.ts) + '</td><td><span class="tag t-' + e.type + '">' + TYPE_LABEL[e.type] + '</span>' + (VOIDED.has(e.id) ? '<span class="tag t-void">ยกเลิกแล้ว</span>' : '') + '</td>' +

function editLogModal(entryId){
  const e = DB.log.find(x => x.id === entryId); if (!e) return;
  const d = drugById(e.drugId);
  const isDisp = e.type === 'dispense';
  const fields = [];
  if (isDisp){
    fields.push({id: 'q', label: 'คิว (เช่น A10)', value: e.queue || ''});
    fields.push({id: 'rx', label: 'เลขที่ใบสั่งยา (ไม่บังคับ)', value: e.rx || ''});
  }
  fields.push({id: 'qty', label: 'จำนวน (' + (e.delta < 0 ? 'จ่ายออก/หัก' : 'บวกเข้า') + ')', value: Math.abs(e.delta), inputmode: 'decimal'});
  if (is28(d ? d.house : e.house) || e.patient) fields.push({id: 'pt', label: 'ชื่อ-นามสกุล ผู้ใช้ยา', value: e.patient || ''});
  fields.push({id: 'b', label: 'เลข BHIS ผู้ดำเนินการ', value: e.bhis || ''});
  fields.push({id: 'n', label: 'หมายเหตุ', value: e.note || ''});

  formModal({title: 'แก้ไขรายการประวัติ', width: 500,
    top: '<div class="msg info" style="margin-bottom:14px">กำลังแก้ไขรายการของ <b>' + esc(nameOfEntry(e)) + '</b></div>',
    fields, saveText: 'บันทึกการแก้ไข',
    onSubmit: async v => {
      const newQty = parseQty(v.qty);
      if (isNaN(newQty) || newQty <= 0) return 'จำนวนต้องเป็นตัวเลขที่มากกว่า 0';
      const staff = staffByBhis(v.b);
      if (!staff) return 'ไม่พบเลข BHIS นี้ในข้อมูลเจ้าหน้าที่';
      
      const newDelta = e.delta < 0 ? -newQty : newQty;
      const patch = {
        delta: newDelta,
        bhis: staff.bhis,
        staffName: staff.name,
        note: v.n || ''
      };
      if (isDisp){
        if (!v.q) return 'กรุณากรอกเลขคิว';
        patch.queue = v.q;
        patch.rx = v.rx || '';
      }
      if (v.pt !== undefined) patch.patient = v.pt;

      await updateLogEntry(entryId, patch);
      if (currentRoute.name === 'history' && currentRoute.id) renderDrugHistory(currentRoute.id);
      else if (currentRoute.name === 'main') renderMain();
      toast('แก้ไขรายการประวัติเรียบร้อยแล้ว', 'ok');
    }});
}
function voidModal(entryId){
  const e = DB.log.find(x => x.id === entryId); if (!e) return;
  formModal({title: 'ยกเลิกรายการจ่ายยานี้', width: 500,
    top: '<div class="msg warn" style="margin-bottom:14px">การยกเลิกจะคืน <b>' + fmt(Math.abs(e.delta)) + '</b> เข้าสต็อกของ ' + esc(nameOfEntry(e)) + '</div>',
    fields: [{id: 'r', label: 'เหตุผล'}, {id: 'b', label: 'เลข BHIS ผู้ดำเนินการ'}], saveText: 'ยกเลิกรายการ',
    onSubmit: async v => {
      if (!v.r) return 'กรุณากรอกเหตุผล';
      const s = staffByBhis(v.b);
      if (!s) return 'ลงชื่อผู้ดำเนินการ: ไม่พบเลข BHIS นี้ในข้อมูลเจ้าหน้าที่';
      if (VOIDED.has(entryId)) return 'รายการนี้ถูกยกเลิกไปแล้ว';
      await addLogs([{id: uid(), ts: Date.now(), type: 'void', voidOf: entryId, drugId: e.drugId, drugName: e.drugName, house: e.house, delta: Math.abs(e.delta), queue: e.queue || '', rx: e.rx || '', patient: e.patient || '', bhis: s.bhis, staffName: s.name, note: 'ยกเลิก: ' + v.r}]);
      if (currentRoute.name === 'history' && currentRoute.id) renderDrugHistory(currentRoute.id);
      toast('ยกเลิกรายการแล้ว คืนยอดเข้าสต็อก', 'ok');

}

  $('#opBhis').addEventListener('keydown', e => { if (e.key === 'Enter') submitStockOp(d.id); });
}
async function submitStockOp(id){
  if (busy) return;
  const d = drugById(id); if (!d) return;
  const errEl = $('#opErr'); errEl.textContent = '';
  const a = r2(parseQty($('#opAdd').value || '0') * opMult($('#opAddU'), d)), r = r2(parseQty($('#opDed').value || '0') * opMult($('#opDedU'), d));
  if (isNaN(a) || isNaN(r)){ errEl.textContent = 'กรอกจำนวนเป็นตัวเลข'; return; }
  if (!(a > 0) && !(r > 0)){ errEl.textContent = 'กรอกจำนวนที่ต้องการเติม หรือหักสต็อก อย่างน้อย 1 ช่อง'; return; }
  const staff = staffByBhis($('#opBhis').value);
  if (!staff){ alertBox('ต้องระบุผู้ดำเนินการ', '', {html: '<span class="th">ลงชื่อผู้ดำเนินการ</span>ต้องกรอกเลข BHIS', onOk: () => $('#opBhis').focus()}); return; }
  const after = r2(d.stock + a - r);
  if (after < 0 && !DB.settings.allowNegative){ errEl.textContent = 'ยอดคงเหลือไม่พอ'; return; }
  const note = $('#opNote').value.trim();
  const now = Date.now(), ents = [];
  const base = {drugId: d.id, drugName: d.name, house: d.house, bhis: staff.bhis, staffName: staff.name, note};
  if (a > 0) ents.push(Object.assign({id: uid(), ts: now, type: 'add', delta: a}, base));
  if (r > 0) ents.push(Object.assign({id: uid(), ts: now + 1, type: 'deduct', delta: -r}, base));
  busy = true; $('#opSave').disabled = true;
  try{ await addLogs(ents); }
  catch(e){ busy = false; const b = $('#opSave'); if (b) b.disabled = false; errEl.textContent = errText(e); return; }
  busy = false;
  if (currentRoute.name === 'drugs' && currentRoute.id === id) drawDrugDetail(id);
  drawDrugList(id);
  toast('บันทึกแล้ว ยอดคงเหลือ: ' + fmt((drugById(id) || {stock: 0}).stock), 'ok');
}
function packFields(d){
  return [{id: 'u', label: 'ชื่อหน่วย', value: d ? (d.unit || 'เม็ด') : 'เม็ด', hint: 'เช่น เม็ด, แคปซูล, ขวด, mL'},
    {id: 's', label: 'จำนวนแผงต่อกล่อง', value: d && d.stripsPerBox ? d.stripsPerBox : '', inputmode: 'numeric'},
    {id: 't', label: 'จำนวนเม็ดต่อแผง', value: d && d.tabsPerStrip ? d.tabsPerStrip : '', inputmode: 'numeric'}];
}
function readPack(v){
  const s = v.s === '' ? 0 : Number(v.s), t = v.t === '' ? 0 : Number(v.t);
  if (!Number.isInteger(s) || !Number.isInteger(t) || s < 0 || t < 0) return {err: 'จำนวนแผงต่อกล่องและเม็ดต่อแผงต้องเป็นเลขจำนวนเต็ม'};
  if (s && !t) return {err: 'กรุณากรอกจำนวนเม็ดต่อแผงด้วย'};
  return {unit: v.u || 'เม็ด', stripsPerBox: s, tabsPerStrip: t};
}
function editField(id, field){
  const d = drugById(id); if (!d) return;
  const refresh = () => { drawDrugDetail(id); drawDrugList(id); };
  if (field === 'name'){
    formModal({title: 'แก้ไขชื่อยา', fields: [{id: 'v', label: 'ชื่อยา', value: d.name}],
      onSubmit: async v => { if (!v.v) return 'กรุณากรอกชื่อยา'; await patchDrug(id, {name: v.v}); refresh(); toast('แก้ไขชื่อยาแล้ว', 'ok'); }});
  } else if (field === 'house'){
    formModal({title: 'แก้ไขบ้านเลขที่', fields: [{id: 'v', label: 'บ้านเลขที่', value: d.house}],
      onSubmit: async v => {
        if (!v.v) return 'กรุณากรอกบ้านเลขที่';
        if (DB.drugs.some(x => x.id !== id && norm(x.house) === norm(v.v))) return 'มีบ้านเลขที่นี้ในระบบแล้ว';
        await patchDrug(id, {house: v.v}); refresh(); toast('แก้ไขบ้านเลขที่แล้ว', 'ok');
      }});
  } else if (field === 'patient'){
    formModal({title: 'ผู้ใช้ยานี้ (ยาตู้ 28)', fields: [{id: 'v', label: 'ชื่อ-นามสกุล ผู้ใช้ยา', value: d.patient || ''}],
      onSubmit: async v => { await patchDrug(id, {patient: v.v}); refresh(); toast('บันทึกชื่อผู้ใช้ยาแล้ว', 'ok'); }});
  } else if (field === 'pack'){
    formModal({title: 'ขนาดบรรจุ', fields: packFields(d),
      onSubmit: async v => { const r = readPack(v); if (r.err) return r.err; await patchDrug(id, {unit: r.unit, stripsPerBox: r.stripsPerBox, tabsPerStrip: r.tabsPerStrip}); refresh(); toast('บันทึกขนาดบรรจุแล้ว', 'ok'); }});
  } else if (field === 'min'){
    formModal({title: 'ระดับเตือนสต็อกต่ำ', fields: [{id: 'v', label: 'เตือนเมื่อคงเหลือถึงหรือต่ำกว่า', value: d.minStock || '', inputmode: 'decimal'}],
      onSubmit: async v => { const n = v.v === '' ? 0 : parseQty(v.v); if (isNaN(n)) return 'กรุณากรอกตัวเลข'; await patchDrug(id, {minStock: n}); refresh(); toast('บันทึกระดับเตือนแล้ว', 'ok'); }});
  } else if (field === 'barcode'){
    formModal({title: 'แก้ไขเลขประจำยา / บาร์โค้ด', fields: [{id: 'v', label: 'เลขประจำยา', value: d.barcode}],
      extra: '<div class="setrow"><button type="button" class="btn small" id="genBc">สร้างเลขใหม่อัตโนมัติ</button></div><div id="bcPrev"></div>',
      onMount: m => {
        const inp = $('#fm_v', m.el), prev = $('#bcPrev', m.el);
        const draw = () => { prev.innerHTML = inp.value.trim() ? barcodeSVG(inp.value.trim(), {module: 2, height: 50}) : ''; };
        inp.addEventListener('input', draw); draw();
        $('#genBc', m.el).addEventListener('click', () => { inp.value = nextBarcode(); draw(); });
      },
      onSubmit: async v => {
        if (!v.v) return 'กรุณากรอกเลขประจำยา';
        if (DB.drugs.some(x => x.id !== id && x.barcode === v.v)) return 'เลขประจำยานี้ซ้ำกับยาตัวอื่น';
        await patchDrug(id, {barcode: v.v}); refresh(); toast('แก้ไขเลขประจำยาแล้ว', 'ok');
      }});
  } else if (field === 'stock'){
    formModal({title: 'แก้ไขยอดคงเหลือ', width: 480,
      top: '<div class="msg info" style="margin-bottom:14px">ยอดปัจจุบัน ' + fmt(d.stock) + ' ' + esc(d.unit || 'เม็ด') + '</div>',
      fields: [{id: 'v', label: 'ยอดคงเหลือที่ถูกต้อง', value: d.stock, inputmode: 'decimal'}, {id: 'b', label: 'เลข BHIS ผู้ดำเนินการ'}, {id: 'n', label: 'หมายเหตุ'}],
      onSubmit: async v => {
        const cur = drugById(id); if (!cur) return 'ไม่พบข้อมูลยา';
        const nv = parseQty(v.v);
        if (isNaN(nv)) return 'กรุณากรอกตัวเลข';
        const s = staffByBhis(v.b);
        if (!s) return 'ลงชื่อผู้ดำเนินการ: ไม่พบเลข BHIS';
        if (nv === cur.stock) return 'ยอดใหม่เท่ากับยอดเดิม';
        await addLogs([{id: uid(), ts: Date.now(), type: 'adjust', drugId: cur.id, drugName: cur.name, house: cur.house, delta: r2(nv - cur.stock), bhis: s.bhis, staffName: s.name, note: v.n}]);
        refresh(); toast('ปรับยอดคงเหลือแล้ว', 'ok');
      }});
  }
}
function deleteDrug(id){
  const d = drugById(id); if (!d) return;
  confirmBox('ยืนยันการลบข้อมูลยา', '', {danger: true, okText: 'ตกลง ลบข้อมูลยา', tone: 'danger',
    html: 'ต้องการลบ <b>' + esc(d.name) + '</b> ใช่หรือไม่',
    onOk: async () => {
      try{ await removeDrug(id); }catch(e){ alertBox('ลบไม่สำเร็จ', errText(e), {tone: 'danger'}); return; }
      if (form.drugId === id) form.drugId = null;
      go('#/drugs'); toast('ลบข้อมูลยาแล้ว', 'ok');
    }});
}
function addDrugModal(){
  formModal({title: 'เพิ่มข้อมูลยา', width: 520,
    fields: [{id: 'h', label: 'บ้านเลขที่'}, {id: 'n', label: 'ชื่อยา'},
      {id: 'q', label: 'จำนวนตั้งต้น', value: '0', inputmode: 'decimal'}]
      .concat(packFields(null))
      .concat([{id: 'm', label: 'ระดับเตือนสต็อกต่ำ', inputmode: 'decimal'}, {id: 'p', label: 'ชื่อ-นามสกุล ผู้ใช้ยา (ยาตู้ 28)'}]),
    extra: '<div class="field"><label>เลขประจำยา / บาร์โค้ด (สร้างให้อัตโนมัติ)</label><div id="newBcNum" style="font-size:18px;font-family:var(--mono)"></div><div id="newBc" style="margin-top:6px"></div></div>',
    onMount: m => {
      const b = nextBarcode(); $('#newBcNum', m.el).textContent = b; $('#newBc', m.el).innerHTML = barcodeSVG(b, {module: 2, height: 50});
      const h = $('#fm_h', m.el), pf = $('#ff_p', m.el);
      const tog = () => { pf.hidden = !is28(h.value); };
      h.addEventListener('input', tog); tog();
    },
    onSubmit: async v => {
      if (!v.h) return 'กรุณากรอกบ้านเลขที่';
      if (!v.n) return 'กรุณากรอกชื่อยา';
      const q = parseQty(v.q === '' ? '0' : v.q);
      if (isNaN(q)) return 'จำนวนตั้งต้นต้องเป็นตัวเลข';
      const pk = readPack(v); if (pk.err) return pk.err;
      const mn = v.m === '' ? 0 : parseQty(v.m); if (isNaN(mn)) return 'ระดับเตือนต้องเป็นตัวเลข';
      if (DB.drugs.some(x => norm(x.house) === norm(v.h))) return 'มีบ้านเลขที่นี้ในระบบแล้ว';
      let d;
      try{ d = await addDrugWithBarcode({house: v.h, name: v.n, patient: is28(v.h) ? v.p : '', unit: pk.unit, stripsPerBox: pk.stripsPerBox, tabsPerStrip: pk.tabsPerStrip, minStock: mn}, q); }
      catch(e){ if (e && e.code === 'dup') return e.message; throw e; }
      go('#/drugs/' + d.id); toast('เพิ่มข้อมูลยาแล้ว', 'ok');
    }});
}
function printBarcode(d){
  const f = document.createElement('iframe');
  f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
  document.body.appendChild(f);
  const doc = f.contentWindow.document;
  doc.open();
  doc.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + esc(d.name) + '</title><style>body{font-family:Tahoma,sans-serif;text-align:center;margin:20px}h3{margin:0 0 4px;font-size:16px}p{margin:0 0 8px;font-size:13px}svg{max-width:100%}</style></head><body><h3>' + esc(d.name) + '</h3><p>บ้านเลขที่ ' + esc(d.house) + '</p>' + barcodeSVG(d.barcode, {module: 2, height: 60}) + '</body></html>');
  doc.close();
  setTimeout(() => { try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(_){ toast('พิมพ์ไม่สำเร็จ', 'err'); } setTimeout(() => f.remove(), 2000); }, 250);
}

/* ================= Staff ================= */
function renderStaff(){
  view.innerHTML =
    '<div class="pagehead"><h1>ข้อมูลเจ้าหน้าที่</h1><div class="btnrow"><button type="button" class="btn" id="expStaff">Export</button><button type="button" class="btn primary" id="btnAddStaff">เพิ่มข้อมูลเจ้าหน้าที่</button></div></div>' +
    '<section class="panel"><p class="sub" style="margin-top:0">เฉพาะเลข BHIS ที่ลงทะเบียนไว้ในหน้านี้เท่านั้น ที่สามารถตัดสต็อกและกดบันทึกข้อมูลได้</p>' +
    '<div class="scroll" style="max-height:none" id="stafflist"></div></section>';
  $('#btnAddStaff').addEventListener('click', () => staffModal(null));
  $('#expStaff').addEventListener('click', () => openExport('ข้อมูลเจ้าหน้าที่', 'bah-staff', [{name: 'เจ้าหน้าที่', headers: STAFF_HEAD, rows: staffRows()}]));
  drawStaff();
}
function drawStaff(){
  const box = $('#stafflist');
  box.innerHTML = DB.staff.length
    ? '<table class="tbl"><thead><tr><th>ชื่อ</th><th>เลข BHIS</th><th></th></tr></thead><tbody>' +
      DB.staff.map(s => '<tr><td><b>' + esc(s.name) + '</b></td><td style="font-family:var(--mono)">' + esc(s.bhis) + '</td><td class="num"><button type="button" class="btn small" data-se="' + s.id + '">แก้ไข</button> <button type="button" class="btn small" data-sd="' + s.id + '" style="color:var(--danger);border-color:var(--danger)">ลบ</button></td></tr>').join('') + '</tbody></table>'
    : '<div class="empty">ยังไม่มีข้อมูลเจ้าหน้าที่</div>';
  $$('[data-se]', box).forEach(b => b.addEventListener('click', () => staffModal(b.dataset.se)));
  $$('[data-sd]', box).forEach(b => b.addEventListener('click', () => {
    const s = DB.staff.find(x => x.id === b.dataset.sd); if (!s) return;
    confirmBox('ยืนยันการลบเจ้าหน้าที่', '', {danger: true, tone: 'danger', okText: 'ตกลง ลบ', html: 'ต้องการลบ <b>' + esc(s.name) + '</b> (BHIS ' + esc(s.bhis) + ') ใช่หรือไม่',
      onOk: async () => { try{ await removeStaff(s.id); }catch(e){ alertBox('ลบไม่สำเร็จ', errText(e), {tone: 'danger'}); return; } drawStaff(); toast('ลบข้อมูลเจ้าหน้าที่แล้ว', 'ok'); }});
  }));
}
function staffModal(id){
  const s = id ? DB.staff.find(x => x.id === id) : null;
  formModal({title: s ? 'แก้ไขข้อมูลเจ้าหน้าที่' : 'เพิ่มข้อมูลเจ้าหน้าที่',
    fields: [{id: 'n', label: 'ชื่อ-นามสกุล', value: s ? s.name : ''}, {id: 'b', label: 'เลข BHIS', value: s ? s.bhis : ''}],
    onSubmit: async v => {
      if (!v.n) return 'กรุณากรอกชื่อ';
      if (!v.b) return 'กรุณากรอกเลข BHIS';
      if (DB.staff.some(x => (!s || x.id !== s.id) && norm(x.bhis) === norm(v.b))) return 'เลข BHIS นี้มีในระบบแล้ว';
      
      if (s) {
        await patchStaff(s.id, {name: v.n, bhis: v.b});
      } else {
        const newId = uid();
        await createStaff({id: newId, name: v.n, bhis: v.b, createdAt: Date.now()});
      }
      if ($('#stafflist')) drawStaff(); 
      toast('บันทึกข้อมูลเจ้าหน้าที่แล้ว', 'ok');
    }});
}

/* ================= Share QR ================= */
function drawQR(box, text){
  box.innerHTML = '';
  if (!text){ box.innerHTML = '<span class="sub">ใส่ลิงก์ด้านล่างเพื่อสร้าง QR Code</span>'; return; }
  if (typeof QRCode === 'undefined'){ box.innerHTML = '<div class="msg warn">สร้าง QR ไม่ได้ (ต้องต่ออินเทอร์เน็ต)</div>'; return; }
  try{ new QRCode(box, {text, width: 240, height: 240, correctLevel: QRCode.CorrectLevel.M}); }catch(e){ box.innerHTML = '<div class="msg warn">ลิงก์ยาวเกินไป</div>'; }
}
function openShare(){
  const url = DB.settings.shareUrl || SHARE_URL_DEFAULT || '';
  openModal({title: 'แชร์การใช้งานผ่าน QR Code', width: 560,
    html: '<div class="qrbox" id="qrBox"></div>' +
      '<div class="field"><label for="shUrl">ลิงก์สำหรับเปิดโปรแกรม BAH med stock</label><input id="shUrl" type="text" data-noenter="1" autocomplete="off" value="' + esc(url) + '"></div>' +
      '<div class="btnrow"><button type="button" class="btn primary" id="shCopy">คัดลอกลิงก์</button><button type="button" class="btn" id="shSaveUrl">บันทึกลิงก์ให้ทุกเครื่อง</button><button type="button" class="btn" id="shPng">บันทึก QR เป็นรูป</button></div>',
    actions: [{label: 'ปิด', cls: 'primary', primary: true, onClick: m => m.close()}],
    onMount: m => {
      const box = $('#qrBox', m.el), inp = $('#shUrl', m.el);
      drawQR(box, inp.value.trim());
      let t; inp.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => drawQR(box, inp.value.trim()), 250); });
      $('#shCopy', m.el).addEventListener('click', async () => {
        const v = inp.value.trim(); if (!v) return toast('ยังไม่มีลิงก์', 'err');
        try{ await navigator.clipboard.writeText(v); toast('คัดลอกลิงก์แล้ว', 'ok'); }
        catch(_){ inp.select(); try{ document.execCommand('copy'); toast('คัดลอกลิงก์แล้ว', 'ok'); }catch(e){ toast('คัดลอกไม่ได้', 'err'); } }
      });
      $('#shSaveUrl', m.el).addEventListener('click', async () => {
        try{ await saveSettings({shareUrl: inp.value.trim()}); toast('บันทึกลิงก์แล้ว', 'ok'); }catch(e){ toast(errText(e), 'err'); }
      });
      $('#shPng', m.el).addEventListener('click', () => {
        const c = $('canvas', box); if (!c) return toast('ยังไม่มี QR Code', 'err');
        c.toBlob(b => saveFile('bah-med-stock-qr.png', b), 'image/png');
      });
    }});
}
$('#btnShare').addEventListener('click', openShare);

/* ================= Settings ================= */
function exportJSON(){ saveFile('bah-backup-' + stamp() + '.json', JSON.stringify({drugs: DB.drugs, staff: DB.staff, log: DB.log, settings: DB.settings}, null, 1)); }
function exportAll(){
  openExport('ข้อมูลทั้งหมด', 'bah-all', [
    {name: 'ข้อมูลยา', headers: DRUG_HEAD, rows: drugRows(DB.drugs)},
    {name: 'ประวัติการตัดยอด', headers: LOG_HEAD, rows: logRows(DB.log.slice())},
    {name: 'เจ้าหน้าที่', headers: STAFF_HEAD, rows: staffRows()}]);
}
function importJSON(file){
  const rd = new FileReader();
  rd.onload = () => {
    let data;
    try{ data = JSON.parse(rd.result); }catch(_){ alertBox('ไฟล์ไม่ถูกต้อง', '', {tone: 'danger'}); return; }
    if (!data || !Array.isArray(data.drugs) || !Array.isArray(data.staff) || !Array.isArray(data.log)){ alertBox('ไฟล์ไม่ถูกต้อง', '', {tone: 'danger'}); return; }
    confirmBox('ยืนยันการนำเข้าข้อมูล', '', {danger: true, tone: 'danger', okText: 'ตกลง แทนที่ข้อมูลทั้งหมด',
      html: 'ข้อมูลปัจจุบันทั้งหมดจะถูกแทนที่ด้วยไฟล์สำรอง',
      onOk: () => {
        DB.drugs = data.drugs.map(d => Object.assign({stock: 0}, strip(d), {id: d.id})); DB.staff = data.staff; DB.log = data.log;
        DB.settings = Object.assign(DEF_SETTINGS(), data.settings || {});
        finish(); route(); toast('นำเข้าข้อมูลแล้ว', 'ok');
      }});
  };
  rd.readAsText(file);
}
function changePassModal(){
  formModal({title: 'เปลี่ยนรหัสผ่าน', width: 460,
    fields: [{id: 'c', label: 'รหัสผ่านปัจจุบัน', type: 'password'}, {id: 'n', label: 'รหัสผ่านใหม่', type: 'password'}, {id: 'r', label: 'ยืนยันรหัสผ่านใหม่', type: 'password'}],
    onSubmit: async v => {
      if (!checkPass(v.c)) return 'รหัสผ่านปัจจุบันไม่ถูกต้อง';
      if (v.n.length < 4) return 'รหัสผ่านใหม่ต้องมีอย่างน้อย 4 ตัวอักษร';
      if (v.n === v.c) return 'รหัสผ่านใหม่ต้องไม่ซ้ำกับรหัสเดิม';
      if (v.n !== v.r) return 'รหัสผ่านใหม่ทั้งสองช่องไม่ตรงกัน';
      const salt = uid(), auth = {salt, hash: sha256hex(salt + '|' + v.n), changedAt: Date.now()};
      const oldTok = unlockTok;
      unlockTok = sha256hex('tok|' + auth.hash);
      try{ sessionStorage.setItem('bah.unlock', unlockTok); }catch(_){}
      try{ await saveAuth(auth); }
      catch(e){ unlockTok = oldTok; try{ if (oldTok) sessionStorage.setItem('bah.unlock', oldTok); }catch(_){} throw e; }
      updateBanner();
      toast('เปลี่ยนรหัสผ่านแล้ว', 'ok');
    }});
}
function firebaseStatusHTML(){
  const cfg = getFirebaseConfig();
  if (MODE === 'cloud' && cfg) return '<div class="msg info" style="font-size:14px">เชื่อมต่อแล้ว · โปรเจกต์ Firebase: <b>' + esc(cfg.projectId || '') + '</b></div>';
  if (cfg && MODE !== 'cloud') return '<div class="msg danger" style="font-size:14px">มีการตั้งค่าไว้ แต่เชื่อมต่อไม่สำเร็จ</div>';
  return '<div class="msg warn" style="font-size:14px">ยังไม่ได้เชื่อมต่อ เครื่องนี้ทำงานแบบเดี่ยว</div>';
}
function openFirebaseHelp(){
  alertBox('วิธีตั้งค่าระบบซิงก์ออนไลน์', '', {width: 600, okText: 'เข้าใจแล้ว', html:
    '<ol style="padding-left:20px;margin:0"><li>ไปที่ <a href="https://console.firebase.google.com" target="_blank" rel="noopener">console.firebase.google.com</a></li></ol>'});
}
function openSettings(){
  openModal({title: 'ตั้งค่า', width: 580,
    html: '<p class="msg info" style="margin-bottom:14px">' + (MODE === 'cloud' ? 'ข้อมูลเก็บบนเซิร์ฟเวอร์และซิงก์ทุกเครื่อง' : 'ข้อมูลถูกเก็บในเบราว์เซอร์เครื่องนี้') + '</p>' +
      '<div class="sec-title">ความปลอดภัย</div>' +
      '<div class="setrow"><button type="button" class="btn" id="sPass">เปลี่ยนรหัสผ่าน</button></div>' +
      '<div class="field" style="max-width:320px"><label for="sLock">ล็อกอัตโนมัติหลังไม่ใช้งาน (นาที)</label><input id="sLock" type="text" inputmode="numeric" data-noenter="1" value="' + esc(DB.settings.autoLockMin) + '"></div>' +
      '<div class="sec-title">กฎการตัดสต็อก</div>' +
      '<div class="switch"><input type="checkbox" id="sNeg"' + (DB.settings.allowNegative ? ' checked' : '') + '><label for="sNeg">อนุญาตให้จ่ายยาเกินสต็อก (ยอดติดลบได้)</label></div>' +
      '<div class="sec-title">ระบบซิงก์ออนไลน์ (Firebase)</div>' +
      firebaseStatusHTML() +
      '<div class="field" style="margin-top:10px"><label for="fbConfig">วางค่า firebaseConfig</label><textarea id="fbConfig" rows="4"></textarea></div>' +
      '<div class="form-err" id="fbErr" role="alert"></div>' +
      '<div class="setrow"><button type="button" class="btn primary" id="fbSave">บันทึกและเชื่อมต่อ</button>' + (getFirebaseConfig() ? '<button type="button" class="btn" id="fbClear" style="color:var(--danger);border-color:var(--danger)">ยกเลิกการเชื่อมต่อ</button>' : '') + '</div>' +
      '<div class="sec-title">ข้อมูล</div>' +
      '<div class="setrow"><button type="button" class="btn" id="sExpAll">Export ข้อมูลทั้งหมด</button><button type="button" class="btn" id="sExpJ">สำรองข้อมูล (.json)</button></div>' +
      (MODE === 'local' ? '<div class="setrow"><button type="button" class="btn" id="sImp">นำเข้าจากไฟล์สำรอง (.json)</button><input type="file" id="sFile" accept=".json,application/json" hidden></div>' : ''),
    actions: [{label: 'ปิด', cls: 'primary', primary: true, onClick: m => m.close()}],
    onMount: m => {
      $('#sPass', m.el).addEventListener('click', () => { m.close(); changePassModal(); });
      $('#sExpAll', m.el).addEventListener('click', () => { m.close(); exportAll(); });
      $('#sExpJ', m.el).addEventListener('click', exportJSON);
      if (MODE === 'local'){
        $('#sImp', m.el).addEventListener('click', () => $('#sFile', m.el).click());
        $('#sFile', m.el).addEventListener('change', e => { const f = e.target.files[0]; if (f){ m.close(); importJSON(f); } });
      }
      $('#sNeg', m.el).addEventListener('change', async e => {
        try{ await saveSettings({allowNegative: e.target.checked}); }catch(er){ e.target.checked = !e.target.checked; toast(errText(er), 'err'); }
      });
      $('#sLock', m.el).addEventListener('change', async e => {
        const n = Number(e.target.value.trim());
        if (!Number.isFinite(n) || n < 0){ e.target.value = DB.settings.autoLockMin; toast('กรอกจำนวนนาทีเป็นตัวเลข 0 ขึ้นไป', 'err'); return; }
        try{ await saveSettings({autoLockMin: Math.round(n)}); toast('บันทึกการล็อกอัตโนมัติแล้ว', 'ok'); }catch(er){ toast(errText(er), 'err'); }
      });
      const fbSave = $('#fbSave', m.el);
      if (fbSave) fbSave.addEventListener('click', () => {
        const raw = $('#fbConfig', m.el).value.trim();
        const err = $('#fbErr', m.el);
        if (!raw){ err.textContent = 'กรุณาวางค่า firebaseConfig ก่อน'; return; }
        let cfg;
        try{ cfg = new Function('return (' + raw + ')')(); }
        catch(e){ err.textContent = 'อ่านค่าที่วางไม่ได้'; return; }
        if (!cfg || !cfg.apiKey || !cfg.projectId){ err.textContent = 'ค่านี้ดูไม่เหมือน firebaseConfig'; return; }
        saveFirebaseConfig(cfg);
        toast('บันทึกแล้ว กำลังเชื่อมต่อใหม่…', 'ok');
        setTimeout(() => location.reload(), 400);
      });
      const fbClear = $('#fbClear', m.el);
      if (fbClear) fbClear.addEventListener('click', () => {
        confirmBox('ยกเลิกการเชื่อมต่อ Firebase?', '', {danger: true, okText: 'ตกลง ยกเลิกการเชื่อมต่อ', tone: 'danger',
          onOk: () => { clearFirebaseConfig(); toast('ยกเลิกการเชื่อมต่อแล้ว', 'ok'); setTimeout(() => location.reload(), 400); }});
      });
    }});
}
$('#btnSettings').addEventListener('click', openSettings);

/* ================= Start ================= */
async function boot(){
  updateBanner();
  setSync('connecting');
  view.innerHTML = '<div class="panel empty">กำลังเชื่อมต่อ…</div>';
  
  const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 5000));
  
  try {
    const db = await Promise.race([tryConnectFirebase(), timeout]);
    if (db && typeof db === 'object' && db.collection){
      MODE = 'cloud'; dbc = db;
      startCloud(db);
      return;
    }
  } catch(e) {
    console.warn('Firebase timed out or failed, falling back to local mode.', e);
  }
  
  MODE = 'local'; loadLocal(); setSync('local'); applyGate();
}
boot();
window.__app = {get DB(){ return DB; }, get MODE(){ return MODE; }, code128Values, C128, barcodeSVG, sha256hex, breakdown, breakdownText};
})();
